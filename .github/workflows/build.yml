# Builds AuroraPAR on GitHub's Windows machines at every push.
# The ready-to-run programs are attached to each run as artifacts (Actions tab -> latest run -> Artifacts; a GitHub
# account is needed to download them). A push to master also publishes the release of the current version
# (Releases page, no account needed). They do not require .NET to be installed.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: >
          dotnet publish AuroraPAR.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:BuildCommit=${{ github.sha }}
          -o publish

      - name: Add the user manual
        run: Copy-Item docs/MANUAL.md publish/MANUAL.md

      - uses: actions/upload-artifact@v5
        with:
          name: AuroraPAR-win-x64
          path: |
            publish/AuroraPAR.exe
            publish/runways.par
            publish/terrain.par
            publish/MANUAL.md
            publish/Profiles/
            publish/Profiles/*.json

      - name: Build AuroraCoord (standalone coordination panel)
        run: >
          dotnet publish Coord/AuroraCoord.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-coord

      - uses: actions/upload-artifact@v5
        with:
          name: AuroraCoord-win-x64
          path: publish-coord/AuroraCoord.exe

      - name: Build CRSCalculator (runway heading and magnetic variation)
        run: >
          dotnet publish CRSCalculator/CRSCalculator.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-crs

      # Checks the magnetic model against the official WMM2025 test values and the geometry against known results:
      # the build fails if a value is wrong.
      - name: Self-test of CRSCalculator
        run: |
          $report = Join-Path $PWD 'crs-selftest.txt'
          $p = Start-Process -FilePath publish-crs/CRSCalculator.exe -ArgumentList '--selftest', $report -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw 'CRSCalculator self-test failed' }

      - uses: actions/upload-artifact@v5
        with:
          name: CRSCalculator-win-x64
          path: publish-crs/CRSCalculator.exe

      # Public download without a GitHub account: one release per version (tag v<Version of the csproj>, e.g. v2.0.0-beta),
      # replaced at every push to master while the version stays the same; a version with a suffix (-beta) is a
      # pre-release. The three programs as zip files, with their SHA-256. AuroraPAR checks the newest release at start.
      - name: Publish the release of this version (Releases)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/AuroraPAR.exe, publish/runways.par, publish/terrain.par, publish/MANUAL.md, publish/Profiles -DestinationPath AuroraPAR-win-x64.zip
          Compress-Archive -Path publish-coord/AuroraCoord.exe -DestinationPath AuroraCoord-win-x64.zip
          Compress-Archive -Path publish-crs/CRSCalculator.exe -DestinationPath CRSCalculator-win-x64.zip
          $zips = 'AuroraPAR-win-x64.zip', 'AuroraCoord-win-x64.zip', 'CRSCalculator-win-x64.zip'
          $zips | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_ } | Set-Content SHA256SUMS.txt
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm')
          $short = '${{ github.sha }}'.Substring(0, 7)
          $version = (Select-Xml -Path AuroraPAR.csproj -XPath '//Version').Node.InnerText
          $tag = "v$version"
          $pre = if ($version.Contains('-')) { '--prerelease' } else { '--latest' }
          $notes = "AuroraPAR v2 $version, build of $date UTC (commit $short). Website: https://atcroom.github.io/AuroraPAR-v2/ - Third-party add-on for IVAO's Aurora software, not made, endorsed or supported by IVAO. Unzip and run; Windows may show a SmartScreen warning (More info -> Run anyway). Your settings and profiles are kept."
          # The old single test build is retired.
          gh release delete test-build --yes --cleanup-tag 2>$null
          gh release delete $tag --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create $tag $zips SHA256SUMS.txt $pre --target '${{ github.sha }}' --title "AuroraPAR v2 $version (build $date UTC)" --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release not created' }
